# Compile FastVer.exe et FastVer-cli.exe (Windows), FastVer-x86_64.AppImage et les paquets .deb et .rpm (Linux), les vérifie, calcule les
# empreintes SHA-256 et publie la release.
# Builds FastVer.exe and FastVer-cli.exe (Windows), FastVer-x86_64.AppImage and the .deb and .rpm packages (Linux), checks them, computes the
# SHA-256 checksums and publishes the release.
#
# Publier une version / publish a version :
#   1. changer APP_VERSION (et BUILD) dans fastver.py / change APP_VERSION (and BUILD) in fastver.py
#   2. git tag v1.2.0 && git push origin v1.2.0
# Lancement manuel (onglet Actions) : compile et teste sans publier.
# Manual run (Actions tab): builds and tests without publishing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      pin_print:
        description: "Afficher les empreintes des outils téléchargés sans les exiger (mise à jour des versions épinglées) / print the downloaded tools' checksums without enforcing them"
        type: boolean
        default: false

# Lecture seule par défaut ; seule l'étape de publication reçoit le droit d'écrire.
# Read-only by default; only the publishing job gets write access.
permissions:
  contents: read

# Outils téléchargés pendant la compilation : version fixe et empreinte SHA-256 vérifiée (point A2).
# Pour changer de version : modifier l'adresse, lancer le workflow à la main avec « pin_print », recopier l'empreinte.
# Tools downloaded during the build: fixed version and verified SHA-256 checksum (item A2).
# To change version: edit the URL, run the workflow manually with “pin_print”, copy the checksum.
env:
  PY_URL: https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.13.14+20260718-x86_64-unknown-linux-gnu-install_only.tar.gz
  PY_SHA256: 5df2686713fcc114290a3b37db3f7253eb837721820ddba4575fdc131e70ec59
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
  RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  PIN_PRINT: ${{ inputs.pin_print && '1' || '' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.13"

      - name: Dépendances / dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip install --disable-pip-version-check --no-deps -r requirements-nodeps.txt

      - name: Tag = APP_VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = (Select-String -Path fastver.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Le tag ${{ github.ref_name }} ne correspond pas à APP_VERSION = $v dans fastver.py"
          }

      - name: Compilation / build
        run: |
          python tools/make_version_info.py
          python -m PyInstaller --noconfirm --clean FastVer.spec
          python -m PyInstaller --noconfirm --clean FastVer-cli.spec

      - name: Autotest de l'exe / exe self-test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath dist\FastVer.exe -ArgumentList "--selftest" -PassThru -Wait
          Get-Content (Join-Path $env:TEMP "fastver.log") -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Autotest en échec (code $($p.ExitCode))" }

      - name: Test de FastVer-cli.exe / FastVer-cli.exe test
        shell: pwsh
        timeout-minutes: 3
        run: |
          dist\FastVer-cli.exe --version
          dist\FastVer-cli.exe --demo --specs --no-color
          if ($LASTEXITCODE -ne 0) { throw "FastVer-cli.exe en échec (code $LASTEXITCODE)" }
          $j = (dist\FastVer-cli.exe --demo --json | Out-String) | ConvertFrom-Json
          if ($j.os.host -ne "PC-DEMO" -or $j.specs.Count -lt 10) { throw "Sortie JSON inattendue" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: windows
          path: |
            dist/FastVer.exe
            dist/FastVer-cli.exe

  linux:
    # Ubuntu 22.04 : les bibliothèques ajoutées à l'AppImage restent compatibles avec glibc 2.34,
    # le minimum déjà imposé par Qt 6.12.
    # Ubuntu 22.04: the libraries added to the AppImage stay compatible with glibc 2.34,
    # the minimum already required by Qt 6.12.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      # Python portable (glibc 2.17) plutôt que celui de setup-python, compilé pour la version d'Ubuntu.
      # Portable Python (glibc 2.17) rather than setup-python's, built for the Ubuntu version.
      - name: Python portable / portable Python
        run: |
          bash tools/fetch_verified.sh "$PY_URL" "$PY_SHA256" "$RUNNER_TEMP/python.tar.gz"
          tar xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"

      - name: Paquets système / system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils xvfb libfuse2 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 rpm

      - name: Dépendances / dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip install --disable-pip-version-check --no-deps -r requirements-nodeps.txt

      - name: Construction de l'AppImage / AppImage build
        run: bash tools/build_appimage.sh

      - name: Autotest de l'AppImage / AppImage self-test
        timeout-minutes: 3
        run: |
          xvfb-run -a release/FastVer-x86_64.AppImage --selftest || { cat ~/.cache/FastVer/fastver.log; exit 1; }
          cat ~/.cache/FastVer/fastver.log

      - name: Mode CLI de l'AppImage / AppImage CLI mode
        run: |
          release/FastVer-x86_64.AppImage --cli --demo --specs --no-color
          release/FastVer-x86_64.AppImage --cli --demo --json | python -c "import json, sys; assert json.load(sys.stdin)['os']['host'] == 'PC-DEMO'"

      # Paquet .deb fait du même dossier PyInstaller que l'AppImage, puis installé et testé sur le runner.
      # .deb package made from the same PyInstaller folder as the AppImage, then installed and tested on the runner.
      - name: Paquet .deb / .deb package
        run: bash tools/build_deb.sh

      - name: Test du paquet .deb / .deb package test
        timeout-minutes: 5
        run: |
          sudo apt-get install -y ./release/fastver_*_amd64.deb
          fastver --version
          fastver-cli --demo --specs --no-color
          xvfb-run -a fastver --selftest || { cat ~/.cache/FastVer/fastver.log; exit 1; }
          sudo apt-get purge -y fastver
          test ! -e /usr/lib/fastver

      # Paquet .rpm fait du même dossier ; il est installé et testé plus bas, dans des conteneurs (job rpm).
      # .rpm package made from the same folder; it is installed and tested below, in containers (rpm job).
      - name: Paquet .rpm / .rpm package
        run: bash tools/build_rpm.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: linux
          path: |
            release/FastVer-x86_64.AppImage
            release/fastver_*_amd64.deb
            release/fastver-*.x86_64.rpm

  # Installation réelle du .rpm sur trois familles : Fedora, RHEL (Rocky Linux 9, glibc 2.34 : le minimum)
  # et openSUSE. Le gestionnaire de paquets doit trouver toutes les dépendances déclarées ; l'autotest
  # vérifie ensuite qu'aucune bibliothèque non déclarée ne manque.
  # Real install of the .rpm on three families: Fedora, RHEL (Rocky Linux 9, glibc 2.34: the minimum)
  # and openSUSE. The package manager must find every declared dependency; the self-test then checks that
  # no undeclared library is missing.
  rpm:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            install: dnf install -y
            extra: xorg-x11-server-Xvfb dejavu-sans-fonts
          - image: rockylinux/rockylinux:9
            install: dnf install -y
            extra: xorg-x11-server-Xvfb dejavu-sans-fonts
          - image: opensuse/tumbleweed
            install: zypper -n install --allow-unsigned-rpm
            extra: xorg-x11-server-Xvfb dejavu-fonts
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: linux
          path: artifacts

      - name: Installation et test / install and test
        shell: bash
        run: |
          ${{ matrix.install }} ./artifacts/fastver-*.x86_64.rpm ${{ matrix.extra }}
          rpm -q fastver
          rpm -V fastver
          fastver --version
          fastver-cli --demo --specs --no-color
          Xvfb :99 -screen 0 1280x800x24 & sleep 2
          DISPLAY=:99 timeout 120 fastver --selftest || { cat ~/.cache/FastVer/fastver.log; exit 1; }
          cat ~/.cache/FastVer/fastver.log
          rpm -e fastver
          test ! -e /usr/lib/fastver

  # Recette AUR (packaging/aur) construite avec makepkg dans un conteneur Arch Linux, à partir de l'AppImage de ce
  # run : .SRCINFO comparé à makepkg --printsrcinfo, namcap, installation par pacman, autotest, désinstallation.
  # AUR recipe (packaging/aur) built with makepkg in an Arch Linux container, from this run's AppImage:
  # .SRCINFO compared with makepkg --printsrcinfo, namcap, install with pacman, self-test, removal.
  aur:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - name: Paquets / packages
        run: pacman -Syu --noconfirm --needed base-devel git namcap xorg-server-xvfb ttf-dejavu

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: linux
          path: artifacts

      - name: Recette et paquet / recipe and package
        shell: bash
        run: |
          VERSION=$(sed -n 's/^APP_VERSION = "\([^"]*\)".*/\1/p' fastver.py)
          SHA=$(sha256sum artifacts/FastVer-x86_64.AppImage | cut -c1-64)
          bash tools/update_aur.sh "$VERSION" "$SHA"
          useradd -m builder
          install -d -o builder /home/builder/fastver-bin
          install -o builder -m 644 packaging/aur/PKGBUILD packaging/aur/.SRCINFO /home/builder/fastver-bin/
          # Fichier déjà présent : makepkg ne le télécharge pas, mais vérifie son empreinte.
          # File already there: makepkg doesn't download it, but checks its checksum.
          install -o builder -m 644 artifacts/FastVer-x86_64.AppImage \
            "/home/builder/fastver-bin/FastVer-$VERSION-x86_64.AppImage"
          cd /home/builder/fastver-bin
          su builder -c "makepkg --printsrcinfo | diff -u .SRCINFO -"
          su builder -c "makepkg -f --noconfirm"
          namcap PKGBUILD fastver-bin-*.pkg.tar.zst || true

      - name: Installation et test / install and test
        shell: bash
        run: |
          cd /home/builder/fastver-bin
          pacman -U --noconfirm fastver-bin-*.pkg.tar.zst
          pacman -Qkk fastver-bin
          fastver --version
          fastver-cli --demo --specs --no-color
          Xvfb :99 -screen 0 1280x800x24 & sleep 2
          DISPLAY=:99 timeout 120 fastver --selftest || { cat ~/.cache/FastVer/fastver.log; exit 1; }
          cat ~/.cache/FastVer/fastver.log
          pacman -R --noconfirm fastver-bin
          test ! -e /usr/lib/fastver
          mkdir -p "$GITHUB_WORKSPACE/aur" && cp PKGBUILD .SRCINFO fastver-bin-*.pkg.tar.zst "$GITHUB_WORKSPACE/aur/"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: aur
          include-hidden-files: true
          path: aur/

  release:
    needs: [windows, linux, rpm, aur]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # créer la release / create the release
      id-token: write       # attestations de provenance (Sigstore) / provenance attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          path: artifacts

      - name: Empreintes SHA-256 / checksums
        run: |
          mkdir release
          cp artifacts/windows/FastVer.exe artifacts/windows/FastVer-cli.exe artifacts/linux/FastVer-x86_64.AppImage \
            artifacts/linux/fastver_*_amd64.deb artifacts/linux/fastver-*.x86_64.rpm fastver.py release/
          cd release
          for f in FastVer.exe FastVer-cli.exe FastVer-x86_64.AppImage fastver_*_amd64.deb fastver-*.x86_64.rpm \
                   fastver.py; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Conserver les fichiers / keep the files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: FastVer
          path: release/*

      # Attestation de provenance signée par GitHub (Sigstore) : prouve que chaque fichier sort de ce workflow,
      # de ce dépôt et de ce commit. Vérification : gh attestation verify FastVer.exe --repo Bulls64/FastVer
      # GitHub-signed provenance attestation (Sigstore): proves each file comes from this workflow, repository
      # and commit. Check: gh attestation verify FastVer.exe --repo Bulls64/FastVer
      # Aussi au lancement manuel : l'étape est ainsi testée avant chaque tag (sans release, l'attestation reste inutilisée).
      # Also on manual runs: the step is thus tested before every tag (with no release, the attestation stays unused).
      - name: Attestations de provenance / provenance attestations
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a   # v3
        with:
          subject-path: |
            release/FastVer.exe
            release/FastVer-cli.exe
            release/FastVer-x86_64.AppImage
            release/fastver_*_amd64.deb
            release/fastver-*.x86_64.rpm
            release/fastver.py

      - name: Publier la release / publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          files: release/*
          generate_release_notes: true
