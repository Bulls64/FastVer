# Compile FastVer.exe (Windows) et FastVer-x86_64.AppImage (Linux), les vérifie, calcule les empreintes SHA-256
# et publie la release.
# Builds FastVer.exe (Windows) and FastVer-x86_64.AppImage (Linux), checks them, computes the SHA-256 checksums
# and publishes the release.
#
# Publier une version / publish a version :
#   1. changer APP_VERSION (et BUILD) dans fastver.py / change APP_VERSION (and BUILD) in fastver.py
#   2. git tag v1.2.0 && git push origin v1.2.0
# Lancement manuel (onglet Actions) : compile et teste sans publier.
# Manual run (Actions tab): builds and tests without publishing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour créer la release / needed to create the release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dépendances / dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip install --disable-pip-version-check --no-deps -r requirements-nodeps.txt

      - name: Tag = APP_VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = (Select-String -Path fastver.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Le tag ${{ github.ref_name }} ne correspond pas à APP_VERSION = $v dans fastver.py"
          }

      - name: Compilation / build
        run: |
          python tools/make_version_info.py
          python -m PyInstaller --noconfirm --clean FastVer.spec

      - name: Autotest de l'exe / exe self-test
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath dist\FastVer.exe -ArgumentList "--selftest" -PassThru -Wait
          Get-Content (Join-Path $env:TEMP "fastver.log") -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Autotest en échec (code $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/FastVer.exe

  linux:
    # Ubuntu 22.04 : les bibliothèques ajoutées à l'AppImage restent compatibles avec glibc 2.34,
    # le minimum déjà imposé par Qt 6.12.
    # Ubuntu 22.04: the libraries added to the AppImage stay compatible with glibc 2.34,
    # the minimum already required by Qt 6.12.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Python portable (glibc 2.17) plutôt que celui de setup-python, compilé pour la version d'Ubuntu.
      # Portable Python (glibc 2.17) rather than setup-python's, built for the Ubuntu version.
      - name: Python portable / portable Python
        run: |
          curl -sSL "https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.13.14+20260718-x86_64-unknown-linux-gnu-install_only.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"

      - name: Paquets système / system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils xvfb libfuse2 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Dépendances / dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip install --disable-pip-version-check --no-deps -r requirements-nodeps.txt

      - name: Construction de l'AppImage / AppImage build
        run: bash tools/build_appimage.sh

      - name: Autotest de l'AppImage / AppImage self-test
        timeout-minutes: 3
        run: |
          xvfb-run -a release/FastVer-x86_64.AppImage --selftest || { cat /tmp/fastver.log; exit 1; }
          cat /tmp/fastver.log

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/FastVer-x86_64.AppImage

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Empreintes SHA-256 / checksums
        run: |
          mkdir release
          cp artifacts/windows/FastVer.exe artifacts/linux/FastVer-x86_64.AppImage fastver.py release/
          cd release
          for f in FastVer.exe FastVer-x86_64.AppImage fastver.py; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Conserver les fichiers / keep the files
        uses: actions/upload-artifact@v4
        with:
          name: FastVer
          path: release/*

      - name: Publier la release / publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
